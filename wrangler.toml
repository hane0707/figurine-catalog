# wrangler.toml
name = "figurine-catalog"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "figurine-catalog-db"
database_id = "205bab26-5462-414a-8288-cdf5f7a01774"

[[r2_buckets]]
binding = "R2"
bucket_name = "figurine-catalog-photos"

[vars]
R2_BUCKET_NAME = "figurine-catalog-photos"
R2_KEY_PREFIX = "" # 本番は空文字。ローカル開発時は .dev.vars で "dev" に上書き
# 以下は wrangler secret put で設定（.toml に書かない）
# CLOUDFLARE_ACCOUNT_ID
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
